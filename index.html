<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>핵심 영단어 플래시카드 (218선)</title>
    <!-- Tailwind CSS 로드 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter & Noto Sans KR -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', 'Noto Sans KR', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* 3D 카드 플립 애니메이션 스타일 */
        .perspective-1000 {
            perspective: 1000px;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.55s cubic-bezier(0.23, 1, 0.32, 1);
            transform-style: preserve-3d;
        }

        .card-inner.is-flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 1.5rem;
            box-shadow: 0 10px 30px -5px rgba(15, 23, 42, 0.08), 0 4px 12px -2px rgba(15, 23, 42, 0.04);
        }

        .card-back {
            transform: rotateY(180deg);
        }

        /* 가로 스크롤바 숨기기 (알파벳 필터 바) */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between bg-slate-50 text-slate-900">

    <!-- 상단 헤더 & 컨트롤 영역 -->
    <header class="w-full max-w-2xl mx-auto px-4 pt-5 pb-2">
        <div class="flex items-center justify-between mb-3">
            <div>
                <div class="flex items-center gap-2">
                    <h1 class="text-lg sm:text-xl font-bold text-slate-800 tracking-tight">핵심 영단어 카드</h1>
                    <span id="total-badge" class="px-2 py-0.5 text-[11px] font-bold bg-indigo-100 text-indigo-700 rounded-md">218단어</span>
                </div>
                <p class="text-xs text-slate-500 mt-0.5">카드를 클릭하면 뜻이 표시됩니다</p>
            </div>
            
            <!-- 상단 유틸리티 버튼 (미암기만 보기 / 셔플) -->
            <div class="flex items-center gap-2">
                <button id="btn-unmemorized" onclick="toggleUnmemorizedFilter()" 
                    class="px-3 py-1.5 rounded-xl text-xs font-semibold border border-slate-200 bg-white text-slate-600 hover:bg-slate-100 transition flex items-center gap-1.5 shadow-sm">
                    <span id="filter-dot" class="w-2 h-2 rounded-full bg-slate-300"></span>
                    <span>미암기만</span>
                </button>
                <button id="btn-shuffle" onclick="toggleShuffle()" 
                    class="px-3 py-1.5 rounded-xl text-xs font-semibold border border-slate-200 bg-white text-slate-600 hover:bg-slate-100 transition flex items-center gap-1 shadow-sm"
                    title="단어 순서 섞기">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                    </svg>
                    <span id="shuffle-label">순서대로</span>
                </button>
            </div>
        </div>

        <!-- 알파벳 빠른 이동 필터 -->
        <div id="alphabet-bar" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-1.5 mb-2">
            <!-- JS에서 동적 생성 -->
        </div>

        <!-- 진행도 표시기 & 프로그레스 바 -->
        <div class="flex items-center justify-between text-xs font-semibold text-slate-500 mb-1.5">
            <span id="progress-text">1 / 218</span>
            <span id="memorized-count" class="text-indigo-600">외움: 0 / 218</span>
        </div>
        <div class="w-full h-2 bg-slate-200 rounded-full overflow-hidden">
            <div id="progress-bar" class="h-full bg-indigo-600 rounded-full transition-all duration-300" style="width: 1%;"></div>
        </div>
    </header>

    <!-- 메인 플래시카드 영역 -->
    <main class="flex-1 flex flex-col items-center justify-center w-full max-w-2xl mx-auto px-4 py-4">
        
        <!-- 빈 상태 안내 (미암기 필터 시 모두 외웠을 경우) -->
        <div id="empty-state" class="hidden w-full h-72 sm:h-80 bg-white rounded-3xl border border-slate-200 shadow-sm flex flex-col items-center justify-center p-6 text-center">
            <div class="w-14 h-14 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center mb-3">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                </svg>
            </div>
            <h2 class="text-lg font-bold text-slate-800 mb-1">해당 조건의 모든 단어를 외웠습니다!</h2>
            <p class="text-sm text-slate-500 mb-4">필터를 해제하여 전체 단어를 다시 복습해 보세요.</p>
            <button onclick="resetFilters()" class="px-4 py-2 bg-indigo-600 text-white text-sm font-semibold rounded-xl hover:bg-indigo-700 transition">
                전체 단어 보기
            </button>
        </div>

        <!-- 3D 플립 카드 컨테이너 -->
        <div id="card-wrapper" class="w-full h-72 sm:h-80 perspective-1000 cursor-pointer" onclick="flipCard()">
            <div id="card-inner" class="card-inner">
                
                <!-- 카드 앞면 (영단어) -->
                <div class="card-face bg-white border border-slate-200/80 flex flex-col justify-between p-6">
                    <div class="flex items-center justify-between">
                        <span id="card-badge-front" class="px-2.5 py-1 bg-slate-100 text-slate-600 text-xs font-bold rounded-lg">A</span>
                        <div class="flex items-center gap-2">
                            <!-- 발음 듣기 버튼 -->
                            <button onclick="speakWord(event)" class="p-2.5 rounded-xl bg-indigo-50 text-indigo-600 hover:bg-indigo-100 active:scale-95 transition" title="발음 듣기">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path>
                                </svg>
                            </button>
                            <!-- 외움 체크 버튼 -->

                                <svg class="w-5 h-5 star-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"></path>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="my-auto text-center px-2">
                        <h2 id="word-text" class="text-3xl sm:text-4xl font-extrabold text-slate-900 tracking-tight break-words">
                            abstract
                        </h2>
                    </div>

                    <div class="text-center">
                        <span class="inline-flex items-center gap-1 text-xs font-medium text-slate-400">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122"></path>
                            </svg>
                            터치하여 뜻 보기
                        </span>
                    </div>
                </div>

                <!-- 카드 뒷면 (한국어 뜻) -->
                <div class="card-face card-back bg-indigo-600 text-white flex flex-col justify-between p-6">
                    <div class="flex items-center justify-between">
                        <span id="word-sub-back" class="text-xs font-semibold text-indigo-200 tracking-wide">abstract</span>
                        <div class="flex items-center gap-2">
                            <!-- 뒷면에서도 발음 듣기 지원 -->
                            <button onclick="speakWord(event)" class="p-2.5 rounded-xl bg-indigo-500/50 text-indigo-100 hover:bg-indigo-500 active:scale-95 transition" title="발음 듣기">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path>
                                </svg>
                            </button>
                            <!-- 외움 체크 버튼 -->
                            <button onclick="toggleMemorized(event)" class="btn-star p-2.5 rounded-xl bg-indigo-500/50 text-indigo-200 hover:bg-indigo-500 hover:text-amber-300 active:scale-95 transition" title="외움 표시">
                                <svg class="w-5 h-5 star-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"></path>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="my-auto text-center px-3">
                        <p id="meaning-text" class="text-2xl sm:text-3xl font-bold leading-snug break-keep">
                            추상적인
                        </p>
                    </div>

                    <div class="text-center">
                        <span class="text-xs font-medium text-indigo-200">터치하여 단어로 돌아가기</span>
                    </div>
                </div>

            </div>
        </div>

        <!-- 하단 화살표 네비게이션 컨트롤 -->
        <div class="w-full flex items-center justify-between gap-4 mt-7">
            <button id="btn-prev" onclick="prevCard()" 
                class="flex-1 py-4 px-5 bg-white border border-slate-200 rounded-2xl shadow-sm hover:bg-slate-50 active:scale-95 disabled:opacity-40 disabled:pointer-events-none transition flex items-center justify-center gap-2 font-bold text-slate-700">
                <svg class="w-6 h-6 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path>
                </svg>
                <span>이전</span>
            </button>

            <button onclick="flipCard()" 
                class="py-4 px-5 bg-slate-200/70 hover:bg-slate-200 active:scale-95 rounded-2xl font-semibold text-slate-700 text-sm transition">
                뒤집기
            </button>

            <button id="btn-next" onclick="nextCard()" 
                class="flex-1 py-4 px-5 bg-indigo-600 text-white rounded-2xl shadow-md shadow-indigo-200 hover:bg-indigo-700 active:scale-95 disabled:opacity-40 disabled:pointer-events-none transition flex items-center justify-center gap-2 font-bold">
                <span>다음</span>
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"></path>
                </svg>
            </button>
        </div>

    </main>

    <!-- 키보드 단축키 안내 푸터 -->
    <footer class="w-full max-w-2xl mx-auto px-4 py-4 text-center">
        <p class="text-[11px] text-slate-400">
            단축키: <span class="px-1.5 py-0.5 bg-slate-200/70 rounded text-slate-600 font-mono">←</span> <span class="px-1.5 py-0.5 bg-slate-200/70 rounded text-slate-600 font-mono">→</span> 카드 이동 · 
            <span class="px-1.5 py-0.5 bg-slate-200/70 rounded text-slate-600 font-mono">Space</span> 카드 뒤집기
        </p>
    </footer>

    <!-- 토스트 알림 메시지 -->
    <div id="toast" class="fixed bottom-16 left-1/2 -translate-x-1/2 bg-slate-800 text-white text-xs font-medium px-4 py-2.5 rounded-full shadow-lg opacity-0 pointer-events-none transition-opacity duration-300 z-50">
        메시지
    </div>

            { word: "substitute", meaning: "대체하다" },
            { word: "subtle", meaning: "미묘한" },
            { word: "sufficient", meaning: "충분한" },
            { word: "susceptible", meaning: "영향받기 쉬운" },
            { word: "sustain", meaning: "유지하다, 지속시키다" },
            { word: "take up", meaning: "차지하다, 시작하다, 다루다" },
            { word: "temporary", meaning: "일시적인" },
            { word: "tentative", meaning: "잠정적인" },
            { word: "transmit", meaning: "전달하다, 전송하다" },
            { word: "tremendous", meaning: "엄청난" },
            { word: "trigger", meaning: "촉발하다" },
            { word: "undergo", meaning: "겪다" },
            { word: "undermine", meaning: "약화시키다" },
            { word: "universal", meaning: "보편적인" },
            { word: "unprecedented", meaning: "전례 없는" },
            { word: "utilize", meaning: "활용하다" },
            { word: "valid", meaning: "타당한, 유효한" },
            { word: "viability", meaning: "실현 가능성" },
            { word: "voluntary", meaning: "자발적인" },
            { word: "whereas", meaning: "반면에" },
            { word: "withdraw", meaning: "철회하다, 물러나다" },
            { word: "yield", meaning: "산출하다, 양보하다" }
        ];

        // 소문자 기준 중복 제거 및 알파벳순 보장
        const uniqueMap = new Map();
        BASE_VOCAB.forEach(item => {
            const key = item.word.trim().toLowerCase();
            if (!uniqueMap.has(key)) {
                uniqueMap.set(key, {
                    word: item.word.trim(),
                    meaning: item.meaning.trim()
                });
            }
        });

        const RAW_VOCAB = Array.from(uniqueMap.values())
            .sort((a, b) => a.word.toLowerCase().localeCompare(b.word.toLowerCase()))
            .map((item, idx) => ({
                ...item,
                id: idx,
                letter: item.word[0].toUpperCase()
            }));

        const VALID_WORDS = new Set(RAW_VOCAB.map(item => item.word));

        // 앱 상태 관리
        let currentList = [...RAW_VOCAB];
        let currentIndex = 0;
        let isFlipped = false;
        let isShuffled = false;
        let selectedLetter = 'ALL';
        let onlyUnmemorized = false;
        let memorizedSet = new Set();

        // 로컬 스토리지에서 외운 단어 기록 불러오기 (유효한 단어만 필터링)
        try {
            const saved = localStorage.getItem('vocab_memorized_v1');
            if (saved) {
                const parsed = JSON.parse(saved);
                memorizedSet = new Set(parsed.filter(w => VALID_WORDS.has(w)));
            }
        } catch (e) {
            console.warn("로컬 스토리지 접근 제한:", e);
        }

        // DOM 요소 캐싱
        const cardInner = document.getElementById('card-inner');
        const cardWrapper = document.getElementById('card-wrapper');
        const emptyState = document.getElementById('empty-state');
        const wordText = document.getElementById('word-text');
        const wordSubBack = document.getElementById('word-sub-back');
        const meaningText = document.getElementById('meaning-text');
        const cardBadgeFront = document.getElementById('card-badge-front');
        const progressText = document.getElementById('progress-text');
        const progressBar = document.getElementById('progress-bar');
        const memorizedCountEl = document.getElementById('memorized-count');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const alphabetBar = document.getElementById('alphabet-bar');

        // 초기화
        function init() {
            document.getElementById('total-badge').textContent = `${RAW_VOCAB.length}단어`;
            renderAlphabetBar();
            applyFilters();
            setupTouchSwipe();
        }

        // 알파벳 필터 바 생성
        function renderAlphabetBar() {
            const letters = ['ALL', ...new Set(RAW_VOCAB.map(item => item.letter))];
            alphabetBar.innerHTML = letters.map(letter => {
                const label = letter === 'ALL' ? '전체' : letter;
                const active = selectedLetter === letter;
                return `
                    <button onclick="selectLetter('${letter}')" 
                        class="px-3 py-1 rounded-lg text-xs font-bold shrink-0 transition ${
                            active 
                            ? 'bg-indigo-600 text-white shadow-sm' 
                            : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-100'
                        }">
                        ${label}
                    </button>
                `;
            }).join('');
        }

        // 알파벳 선택
        function selectLetter(letter) {
            selectedLetter = letter;
            renderAlphabetBar();
            applyFilters();
        }

        // 필터 및 정렬 적용
        function applyFilters() {
            let filtered = RAW_VOCAB.filter(item => {
                const matchLetter = selectedLetter === 'ALL' || item.letter === selectedLetter;
                const matchMem = !onlyUnmemorized || !memorizedSet.has(item.word);
                return matchLetter && matchMem;
            });

            if (isShuffled) {
                for (let i = filtered.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [filtered[i], filtered[j]] = [filtered[j], filtered[i]];
                }
            }

            currentList = filtered;
            currentIndex = 0;
            isFlipped = false;
            cardInner.classList.remove('is-flipped');
            renderCard();
        }

        // 현재 카드 렌더링
        function renderCard() {
            memorizedCountEl.textContent = `외움: ${memorizedSet.size} / ${RAW_VOCAB.length}`;

            if (currentList.length === 0) {
                cardWrapper.classList.add('hidden');
                emptyState.classList.remove('hidden');
                progressText.textContent = `0 / 0`;
                progressBar.style.width = `0%`;
                btnPrev.disabled = true;
                btnNext.disabled = true;
                return;
            }

            cardWrapper.classList.remove('hidden');
            emptyState.classList.add('hidden');

            const item = currentList[currentIndex];
            wordText.textContent = item.word;
            wordSubBack.textContent = item.word;
            meaningText.textContent = item.meaning;
            cardBadgeFront.textContent = item.letter;

            // 진행도 업데이트
            const total = currentList.length;
            const currentNum = currentIndex + 1;
            progressText.textContent = `${currentNum} / ${total}`;
            progressBar.style.width = `${(currentNum / total) * 100}%`;

            // 이전/다음 버튼 상태
            btnPrev.disabled = currentIndex === 0;
            btnNext.disabled = currentIndex === total - 1;

            // 별표(외움) 아이콘 상태 업데이트
            updateStarUI(memorizedSet.has(item.word));
        }

        // 카드 뒤집기
        function flipCard() {
            if (currentList.length === 0) return;
            isFlipped = !isFlipped;
            if (isFlipped) {
                cardInner.classList.add('is-flipped');
            } else {
                cardInner.classList.remove('is-flipped');
            }
        }

        // 다음 카드로 이동 (항상 앞면으로 리셋)
        function nextCard() {
            if (currentIndex < currentList.length - 1) {
                currentIndex++;
                resetAndRender();
            } else {
                showToast("마지막 단어입니다!");
            }
        }

        // 이전 카드로 이동 (항상 앞면으로 리셋)
        function prevCard() {
            if (currentIndex > 0) {
                currentIndex--;
                resetAndRender();
            } else {
                showToast("첫 번째 단어입니다!");
            }
        }

        // 앞면으로 초기화 후 렌더링
        function resetAndRender() {
            if (isFlipped) {
                isFlipped = false;
                cardInner.classList.remove('is-flipped');
                setTimeout(() => {
                    renderCard();
                }, 140);
            } else {
                renderCard();
            }
        }

        // 셔플 토글
        function toggleShuffle() {
            isShuffled = !isShuffled;
            const label = document.getElementById('shuffle-label');
            const btn = document.getElementById('btn-shuffle');
            
            if (isShuffled) {
                label.textContent = '랜덤 섞기';
                btn.classList.add('border-indigo-300', 'bg-indigo-50', 'text-indigo-700');
                showToast("단어 순서를 무작위로 섞었습니다.");
            } else {
                label.textContent = '순서대로';
                btn.classList.remove('border-indigo-300', 'bg-indigo-50', 'text-indigo-700');
                showToast("알파벳 순서로 정렬했습니다.");
            }
            applyFilters();
        }

        // 미암기 필터 토글
        function toggleUnmemorizedFilter() {
            onlyUnmemorized = !onlyUnmemorized;
            const btn = document.getElementById('btn-unmemorized');
            const dot = document.getElementById('filter-dot');

            if (onlyUnmemorized) {
                btn.classList.add('border-indigo-300', 'bg-indigo-50', 'text-indigo-700');
                dot.classList.replace('bg-slate-300', 'bg-indigo-600');
                showToast("외우지 않은 단어만 표시합니다.");
            } else {
                btn.classList.remove('border-indigo-300', 'bg-indigo-50', 'text-indigo-700');
                dot.classList.replace('bg-indigo-600', 'bg-slate-300');
                showToast("모든 단어를 표시합니다.");
            }
            applyFilters();
        }

        // 필터 전체 초기화
        function resetFilters() {
            selectedLetter = 'ALL';
            onlyUnmemorized = false;
            const btn = document.getElementById('btn-unmemorized');
            const dot = document.getElementById('filter-dot');
            btn.classList.remove('border-indigo-300', 'bg-indigo-50', 'text-indigo-700');
            dot.classList.replace('bg-indigo-600', 'bg-slate-300');
            renderAlphabetBar();
            applyFilters();
        }

        // 외움 표시 토글
        function toggleMemorized(event) {
            event.stopPropagation();
            if (currentList.length === 0) return;

            const word = currentList[currentIndex].word;
            if (memorizedSet.has(word)) {
                memorizedSet.delete(word);
                showToast(`'${word}' 외움 해제`);
            } else {
                memorizedSet.add(word);
                showToast(`'${word}' 외움 완료!`);
            }

            try {
                localStorage.setItem('vocab_memorized_v1', JSON.stringify([...memorizedSet]));
            } catch (e) {}

            updateStarUI(memorizedSet.has(word));
            memorizedCountEl.textContent = `외움: ${memorizedSet.size} / ${RAW_VOCAB.length}`;
        }

        // 별표 UI 갱신
        function updateStarUI(isMem) {
            const starIcons = document.querySelectorAll('.star-icon');
            starIcons.forEach(icon => {
                if (isMem) {
                    icon.setAttribute('fill', '#f59e0b');
                    icon.setAttribute('stroke', '#f59e0b');
                } else {
                    icon.setAttribute('fill', 'none');
                    icon.setAttribute('stroke', 'currentColor');
                }
            });
        }

        // 영어 발음 듣기 (Web Speech API)
        function speakWord(event) {
            event.stopPropagation();
            if (currentList.length === 0) return;

            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(currentList[currentIndex].word);
                utterance.lang = 'en-US';
                utterance.rate = 0.92;
                window.speechSynthesis.speak(utterance);
            } else {
                showToast("이 브라우저에서는 음성 합성을 지원하지 않습니다.");
            }
        }

        // 토스트 알림 표시
        let toastTimer = null;
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.remove('opacity-0');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.add('opacity-0');
            }, 1800);
        }

        // 키보드 단축키 지원
        document.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowRight') {
                e.preventDefault();
                nextCard();
            } else if (e.code === 'ArrowLeft') {
                e.preventDefault();
                prevCard();
            } else if (e.code === 'Space' || e.code === 'Enter') {
                e.preventDefault();
                flipCard();
            }
        });

        // 모바일 터치 스와이프 지원
        function setupTouchSwipe() {
            let touchStartX = 0;
            let touchEndX = 0;

            cardWrapper.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].screenX;
            }, { passive: true });

            cardWrapper.addEventListener('touchend', (e) => {
                touchEndX = e.changedTouches[0].screenX;
                const diff = touchStartX - touchEndX;
                if (Math.abs(diff) > 55) {
                    if (diff > 0) {
                        nextCard();
                    } else {
                        prevCard();
                    }
                }
            }, { passive: true });
        }

        // 앱 시작
        window.onload = init;
    </script>
