<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>핵심 영단어 카드</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .perspective {
      perspective: 1000px;
    }
    .preserve-3d {
      transform-style: preserve-3d;
      transition: transform 0.4s ease;
    }
    .backface-hidden {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .rotate-y-180 {
      transform: rotateY(180deg);
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between p-4 select-none max-w-md mx-auto">

  <!-- 상단 영역 -->
  <header class="w-full flex flex-col gap-3 pt-2">
    <div class="flex items-start justify-between">
      <div>
        <h1 class="text-xl font-bold text-slate-900">핵심 영단어 카드</h1>
        <p class="text-xs text-slate-500 mt-0.5">카드를 클릭하면 뜻이 표시됩니다</p>
      </div>
      <div class="flex items-center gap-2">
        <button id="btn-filter-unmemorized" class="flex items-center gap-1.5 px-3 py-1.5 bg-white border border-slate-200 rounded-full text-xs font-medium text-slate-700 shadow-sm transition">
          <span class="w-2 h-2 rounded-full bg-slate-300"></span> 미암기만
        </button>
        <button id="btn-shuffle" class="flex items-center gap-1 px-3 py-1.5 bg-white border border-slate-200 rounded-full text-xs font-medium text-slate-700 shadow-sm transition">
          🔄 순서대로
        </button>
      </div>
    </div>

    <!-- 알파벳 필터 바 -->
    <div id="alphabet-bar" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-1">
      <!-- 동적 생성 -->
    </div>

    <!-- 진행 상황 표시 -->
    <div class="flex items-center justify-between text-xs font-medium text-violet-600 mt-1">
      <span id="counter">1 / 172</span>
      <span id="memorized-status">외움: 0 / 172</span>
    </div>
    <div class="w-full bg-slate-200 h-1.5 rounded-full overflow-hidden">
      <div id="progress-bar" class="bg-violet-600 h-full w-0 transition-all duration-300"></div>
    </div>
  </header>

  <!-- 카드 영역 -->
  <main class="w-full flex-1 flex flex-col items-center justify-center my-6">
    <div id="card-container" class="w-full h-80 perspective cursor-pointer">
      <div id="card-inner" class="relative w-full h-full preserve-3d shadow-md rounded-3xl">
        
        <!-- 앞면 -->
        <div class="absolute inset-0 backface-hidden bg-white rounded-3xl border border-slate-100 p-6 flex flex-col justify-between">
          <div class="flex items-center justify-between">
            <span id="card-alpha-badge" class="text-xs font-bold px-2.5 py-1 bg-slate-100 text-slate-600 rounded-lg">A</span>
            <div class="flex items-center gap-1">
              <button id="btn-speak" class="p-2 text-slate-400 hover:text-violet-600 transition" title="발음 듣기">🔊</button>
              <button id="btn-star-front" class="p-2 text-slate-300 hover:text-amber-400 text-lg transition" title="외운 단어 체크">⭐</button>
            </div>
          </div>
          <div class="flex-1 flex flex-col items-center justify-center text-center">
            <h2 id="word-text" class="text-3xl font-extrabold text-slate-900 tracking-tight">abstract</h2>
            <p class="text-xs text-slate-400 mt-3">✨ 터치하여 뜻 보기</p>
          </div>
          <div class="h-6"></div>
        </div>

        <!-- 뒷면 -->
        <div class="absolute inset-0 backface-hidden rotate-y-180 bg-violet-600 text-white rounded-3xl p-6 flex flex-col justify-between shadow-inner">
          <div class="flex items-center justify-between">
            <span id="word-text-back" class="text-xs font-medium text-violet-200">abstract</span>
            <button id="btn-star-back" class="p-2 text-violet-200 hover:text-amber-300 text-lg transition" title="외운 단어 체크">⭐</button>
          </div>
          <div class="flex-1 flex flex-col items-center justify-center text-center">
            <p id="meaning-text" class="text-2xl font-bold leading-snug">추상적인</p>
          </div>
          <div class="text-center">
            <span class="text-[11px] text-violet-200">터치하면 단어로 돌아갑니다</span>
          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- 하단 네비게이션 -->
  <footer class="w-full flex items-center gap-3 pb-2">
    <button id="btn-prev" class="flex-1 py-3.5 bg-white border border-slate-200 hover:bg-slate-50 text-slate-600 font-semibold rounded-2xl shadow-sm transition flex items-center justify-center gap-1">
      <span class="text-sm">〈</span> 이전
    </button>
    <button id="btn-flip" class="py-3.5 px-6 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-2xl transition">
      뒤집기
    </button>
    <button id="btn-next" class="flex-1 py-3.5 bg-violet-600 hover:bg-violet-700 text-white font-semibold rounded-2xl shadow-sm transition flex items-center justify-center gap-1">
      다음 <span class="text-sm">〉</span>
    </button>
  </footer>

  <script>

      { word: "encounter", meaning: "마주치다" },

      { word: "equivalent", meaning: "동등한" },

      { word: "exceed", meaning: "초과하다" },

      { word: "exceptional", meaning: "예외적인, 뛰어난" },

      { word: "expectation", meaning: "기대" },

      { word: "exploit", meaning: "이용하다, 활용하다" },
      { word: "expose", meaning: "노출하다, 드러내다" },
      { word: "extract", meaning: "추출하다" },
      { word: "facilitate", meaning: "촉진하다, 용이하게 하다" },
      { word: "feasible", meaning: "실행 가능한" },
      { word: "fragile", meaning: "취약한, 깨지기 쉬운" },
      { word: "fundamental", meaning: "근본적인" },
      { word: "generate", meaning: "발생시키다, 만들어 내다" },
      { word: "genuine", meaning: "진정한" },
      { word: "gradual", meaning: "점진적인" },
      { word: "identical", meaning: "동일한" },
      { word: "implication", meaning: "함의, 영향" },
      { word: "implicit", meaning: "암묵적인" },
      { word: "impose", meaning: "부과하다, 강요하다" },
      { word: "incentive", meaning: "동기, 유인" },
      { word: "incorporate", meaning: "포함하다, 통합하다" },
      { word: "independent", meaning: "독립적인" },
      { word: "indispensable", meaning: "필수적인" },
      { word: "induce", meaning: "유발하다" },
      { word: "inevitable", meaning: "불가피한" },
      { word: "infer", meaning: "추론하다" },
      { word: "inherent", meaning: "내재적인, 본질적인" },
      { word: "inhibit", meaning: "억제하다" },
      { word: "initiate", meaning: "시작하다" },
      { word: "innovative", meaning: "혁신적인" },
      { word: "insight", meaning: "통찰" },
      { word: "integrate", meaning: "통합하다" },
      { word: "intensive", meaning: "집중적인" },
      { word: "interpret", meaning: "해석하다" },
      { word: "intervene", meaning: "개입하다" },
      { word: "isolate", meaning: "분리하다" },
      { word: "justify", meaning: "정당화하다" },
      { word: "manipulate", meaning: "조작하다, 다루다" },
      { word: "marginal", meaning: "미미한, 주변의" },
      { word: "mechanism", meaning: "작동 원리, 기제" },
      { word: "misconception", meaning: "오해" },
      { word: "modest", meaning: "적당한, 크지 않은" },
      { word: "modify", meaning: "수정하다" },
      { word: "mutual", meaning: "상호 간의" },
      { word: "objective", meaning: "객관적인" },
      { word: "obscure", meaning: "불분명한, 모호한" },
      { word: "obtain", meaning: "얻다" },
      { word: "optimal", meaning: "최적의" },
      { word: "original", meaning: "독창적인, 원래의" },
      { word: "overcome", meaning: "극복하다" },
      { word: "overwhelming", meaning: "압도적인" },
      { word: "perceive", meaning: "인식하다" },
      { word: "persist", meaning: "지속하다" },
      { word: "persistent", meaning: "지속적인" },
      { word: "plausible", meaning: "그럴듯한" },
      { word: "prevalent", meaning: "널리 퍼진" },
      { word: "primitive", meaning: "원시적인" },
      { word: "principle", meaning: "원리, 원칙" },
      { word: "procedure", meaning: "절차" },
      { word: "profound", meaning: "심오한, 중대한" },
      { word: "prominent", meaning: "두드러진" },
      { word: "promote", meaning: "촉진하다" },
      { word: "proportion", meaning: "비율" },
      { word: "pursue", meaning: "추구하다" },
      { word: "rational", meaning: "합리적인" },
      { word: "reciprocal", meaning: "상호적인" },
      { word: "relevant", meaning: "관련 있는" },
      { word: "reliable", meaning: "신뢰할 수 있는" },
      { word: "reluctant", meaning: "꺼리는" },
      { word: "remarkable", meaning: "주목할 만한" },
      { word: "representation", meaning: "표현, 재현" },
      { word: "restrict", meaning: "제한하다" },
      { word: "retain", meaning: "보유하다, 유지하다" },
      { word: "rigid", meaning: "엄격한, 경직된" },
      { word: "scarce", meaning: "부족한, 희귀한" },
      { word: "stimulate", meaning: "자극하다, 촉진하다" },
      { word: "subjective", meaning: "주관적인" },
      { word: "subsequent", meaning: "그 이후의" },
      { word: "substitute", meaning: "대체하다" },
      { word: "subtle", meaning: "미묘한" },
      { word: "sufficient", meaning: "충분한" },
      { word: "sustain", meaning: "유지하다, 지속시키다" },
      { word: "temporary", meaning: "일시적인" },
      { word: "tentative", meaning: "잠정적인" },
      { word: "transmit", meaning: "전달하다, 전송하다" },
      { word: "tremendous", meaning: "엄청난" },
      { word: "trigger", meaning: "촉발하다" },
      { word: "undergo", meaning: "겪다" },
      { word: "undermine", meaning: "약화시키다" },
      { word: "universal", meaning: "보편적인" },
      { word: "utilize", meaning: "활용하다" },
      { word: "valid", meaning: "타당한, 유효한" },
      { word: "voluntary", meaning: "자발적인" },
      { word: "whereas", meaning: "반면에" },
      { word: "withdraw", meaning: "철회하다, 물러나다" },
      { word: "yield", meaning: "산출하다, 양보하다" }
    ];

    let deck = [...INITIAL_WORDS];
    let currentIndex = 0;
    let isFlipped = false;
    let memorizedSet = new Set();
    let filterMode = 'all'; // 'all', 'unmemorized', 'alpha'
    let currentAlpha = '전체';
    let isShuffled = false;

    const cardInner = document.getElementById("card-inner");
    const cardContainer = document.getElementById("card-container");
    const wordText = document.getElementById("word-text");
    const wordTextBack = document.getElementById("word-text-back");
    const meaningText = document.getElementById("meaning-text");
    const counter = document.getElementById("counter");
    const memorizedStatus = document.getElementById("memorized-status");
    const progressBar = document.getElementById("progress-bar");
    const cardAlphaBadge = document.getElementById("card-alpha-badge");
    const btnStarFront = document.getElementById("btn-star-front");
    const btnStarBack = document.getElementById("btn-star-back");
    const btnFilterUnmemorized = document.getElementById("btn-filter-unmemorized");
    const btnShuffle = document.getElementById("btn-shuffle");
    const alphabetBar = document.getElementById("alphabet-bar");

    function updateDeck() {
      let base = [...INITIAL_WORDS];

      if (filterMode === 'unmemorized') {
        base = base.filter(item => !memorizedSet.has(item.word));
      } else if (filterMode === 'alpha' && currentAlpha !== '전체') {
        base = base.filter(item => item.word[0].toUpperCase() === currentAlpha);
      }

      if (isShuffled) {
        for (let i = base.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [base[i], base[j]] = [base[j], base[i]];
        }
      } else {
        base.sort((a, b) => a.word.localeCompare(b.word));
      }

      deck = base;
      if (currentIndex >= deck.length) currentIndex = 0;
      if (deck.length === 0) currentIndex = 0;
    }

    function renderAlphabetBar() {
      alphabetBar.innerHTML = "";
      const letters = ['전체', ...new Set(INITIAL_WORDS.map(item => item.word[0].toUpperCase()))].sort((a, b) => {
        if (a === '전체') return -1;
        if (b === '전체') return 1;
        return a.localeCompare(b);
      });

      letters.forEach(letter => {
        const btn = document.createElement("button");
        btn.textContent = letter;
        const isActive = (filterMode === 'alpha' && currentAlpha === letter) || (filterMode !== 'alpha' && letter === '전체');
        
        btn.className = `px-3.5 py-1.5 text-xs font-bold rounded-full transition shrink-0 ${
          isActive 
            ? 'bg-violet-600 text-white shadow-sm' 
            : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-100'
        }`;

        btn.onclick = () => {
          if (letter === '전체') {
            filterMode = filterMode === 'unmemorized' ? 'unmemorized' : 'all';
            currentAlpha = '전체';
          } else {
            filterMode = 'alpha';
            currentAlpha = letter;
          }
          currentIndex = 0;
          isFlipped = false;
          updateDeck();
          updateCard();
          renderAlphabetBar();
        };
        alphabetBar.appendChild(btn);
      });
    }

    function updateCard() {
      memorizedStatus.textContent = `외움: ${memorizedSet.size} / ${INITIAL_WORDS.length}`;
      
      if (deck.length === 0) {
        wordText.textContent = "조건에 맞는 단어가 없습니다";
        wordTextBack.textContent = "완료";
        meaningText.textContent = "다른 필터를 선택해 보세요.";
        counter.textContent = "0 / 0";
        progressBar.style.width = "0%";
        cardAlphaBadge.textContent = "-";
        return;
      }

      if (currentIndex >= deck.length) currentIndex = deck.length - 1;
      if (currentIndex < 0) currentIndex = 0;

      const currentItem = deck[currentIndex];
      wordText.textContent = currentItem.word;
      wordTextBack.textContent = currentItem.word;
      meaningText.textContent = currentItem.meaning;
      counter.textContent = `${currentIndex + 1} / ${deck.length}`;
      cardAlphaBadge.textContent = currentItem.word[0].toUpperCase();

      const progressPercent = ((currentIndex + 1) / deck.length) * 100;
      progressBar.style.width = `${progressPercent}%`;

      const isMem = memorizedSet.has(currentItem.word);
      btnStarFront.style.color = isMem ? "#fbbf24" : "#cbd5e1";
      btnStarBack.style.color = isMem ? "#fde047" : "rgba(255,255,255,0.5)";

      if (isFlipped) {
        cardInner.classList.add("rotate-y-180");
      } else {
        cardInner.classList.remove("rotate-y-180");
      }
    }

    function flipCard() {
      if (deck.length === 0) return;
      isFlipped = !isFlipped;
      updateCard();
    }

    function nextCard() {
      if (deck.length === 0) return;
      isFlipped = false;
      currentIndex = (currentIndex + 1) % deck.length;
      updateCard();
    }

    function prevCard() {
      if (deck.length === 0) return;
      isFlipped = false;
      currentIndex = (currentIndex - 1 + deck.length) % deck.length;
      updateCard();
    }

    function toggleMemorized(e) {
      e.stopPropagation();
      if (deck.length === 0) return;
      const word = deck[currentIndex].word;
      if (memorizedSet.has(word)) {
        memorizedSet.delete(word);
      } else {
        memorizedSet.add(word);
      }
      updateCard();
    }

    function speakWord(e) {
      e.stopPropagation();
      if (deck.length === 0 || !("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(deck[currentIndex].word);
      utterance.lang = "en-US";
      utterance.rate = 0.95;
      window.speechSynthesis.speak(utterance);
    }

    // 이벤트 리스너
    cardContainer.addEventListener("click", flipCard);
    document.getElementById("btn-flip").addEventListener("click", flipCard);
    document.getElementById("btn-next").addEventListener("click", nextCard);
    document.getElementById("btn-prev").addEventListener("click", prevCard);
    btnStarFront.addEventListener("click", toggleMemorized);
    btnStarBack.addEventListener("click", toggleMemorized);
    document.getElementById("btn-speak").addEventListener("click", speakWord);

    btnFilterUnmemorized.addEventListener("click", () => {
      if (filterMode === 'unmemorized') {
        filterMode = currentAlpha !== '전체' ? 'alpha' : 'all';
        btnFilterUnmemorized.classList.remove("bg-violet-600", "text-white", "border-violet-600");
        btnFilterUnmemorized.classList.add("bg-white", "text-slate-700", "border-slate-200");
      } else {
        filterMode = 'unmemorized';
        btnFilterUnmemorized.classList.add("bg-violet-600", "text-white", "border-violet-600");
        btnFilterUnmemorized.classList.remove("bg-white", "text-slate-700", "border-slate-200");
      }
      currentIndex = 0;
      isFlipped = false;
      updateDeck();
      updateCard();
    });

    btnShuffle.addEventListener("click", () => {
      isShuffled = !isShuffled;
      btnShuffle.textContent = isShuffled ? "🔀 섞임" : "🔄 순서대로";
      btnShuffle.className = isShuffled 
        ? "flex items-center gap-1 px-3 py-1.5 bg-violet-50 border border-violet-200 rounded-full text-xs font-medium text-violet-700 shadow-sm transition"
        : "flex items-center gap-1 px-3 py-1.5 bg-white border border-slate-200 rounded-full text-xs font-medium text-slate-700 shadow-sm transition";
      currentIndex = 0;
      isFlipped = false;
      updateDeck();
      updateCard();
    });

    // 키보드 단축키
    document.addEventListener("keydown", (e) => {
      if (e.code === "ArrowRight") nextCard();
      else if (e.code === "ArrowLeft") prevCard();
      else if (e.code === "Space" || e.code === "Enter") {
        e.preventDefault();
        flipCard();
      }
    });

    // 초기 실행
    updateDeck();
    renderAlphabetBar();
    updateCard();
  </script>
</body>
</html>
