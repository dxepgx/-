<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>필수 영단어 플래시카드 (172단어)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .perspective {
      perspective: 1000px;
    }
    .preserve-3d {
      transform-style: preserve-3d;
      transition: transform 0.45s cubic-bezier(0.23, 1, 0.32, 1);
    }
    .backface-hidden {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .rotate-y-180 {
      transform: rotateY(180deg);
    }
    /* 스크롤바 숨김 */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col items-center justify-between p-4 select-none">

  <!-- 상단 헤더 & 컨트롤 -->
  <header class="w-full max-w-xl flex flex-col gap-3 pt-2">
    <div class="flex items-center justify-between">
      <h1 class="text-xl font-bold text-slate-900 tracking-tight">영단어 플래시카드</h1>
      <span id="counter" class="text-sm font-semibold bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full">
        1 / 172
      </span>
    </div>

    <!-- 기능 버튼 바 -->
    <div class="flex flex-wrap items-center justify-between gap-2 bg-white p-2.5 rounded-xl shadow-sm border border-slate-200/80">
      <div class="flex items-center gap-1.5">
        <button id="btn-shuffle" class="px-3 py-1.5 text-xs font-medium rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 transition">
          🔀 랜덤 섞기
        </button>
        <button id="btn-reset-order" class="px-3 py-1.5 text-xs font-medium rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 transition">
          🔤 알파벳순
        </button>
      </div>
      <div class="flex items-center gap-1.5">
        <button id="btn-filter-unmemorized" class="px-3 py-1.5 text-xs font-medium rounded-lg bg-amber-50 hover:bg-amber-100 text-amber-700 border border-amber-200 transition">
          ☆ 미암기만 보기 (<span id="unmemorized-count">172</span>)
        </button>
      </div>
    </div>

    <!-- 알파벳 빠른 이동 바 -->
    <div id="alphabet-bar" class="flex items-center gap-1 overflow-x-auto no-scrollbar py-1"></div>
  </header>

  <!-- 중앙 카드 영역 -->
  <main class="w-full max-w-xl flex-1 flex flex-col items-center justify-center my-4">
    <div id="card-container" class="w-full h-80 sm:h-96 perspective cursor-pointer">
      <div id="card-inner" class="relative w-full h-full preserve-3d">
        
        <!-- 카드 앞면 (영단어) -->
        <div class="absolute inset-0 backface-hidden bg-white rounded-3xl shadow-lg border border-slate-200/80 p-6 flex flex-col justify-between">
          <div class="flex items-center justify-between">
            <span id="card-alpha-badge" class="text-xs font-bold uppercase tracking-wider px-2.5 py-1 rounded-md bg-slate-100 text-slate-500">
              A
            </span>
            <div class="flex items-center gap-2">
              <button id="btn-speak" type="button" title="발음 듣기" class="p-2 rounded-full hover:bg-slate-100 text-slate-500 hover:text-indigo-600 transition">
                🔊
              </button>
              <button id="btn-star-front" type="button" title="암기 완료 표시" class="p-2 rounded-full hover:bg-slate-100 text-xl leading-none transition">
                ☆
              </button>
            </div>
          </div>

          <div class="flex-1 flex flex-col items-center justify-center text-center px-2">
            <h2 id="word-text" class="text-3xl sm:text-4xl font-extrabold text-slate-900 tracking-tight break-words">
              abstract
            </h2>
            <p class="mt-4 text-xs text-slate-400">카드를 클릭하거나 Space 키를 눌러 뜻 확인</p>
          </div>

          <div class="h-6"></div>
        </div>

        <!-- 카드 뒷면 (한국어 뜻) -->
        <div class="absolute inset-0 backface-hidden rotate-y-180 bg-indigo-600 text-white rounded-3xl shadow-lg p-6 flex flex-col justify-between">
          <div class="flex items-center justify-between">
            <span id="word-text-back" class="text-sm font-semibold text-indigo-200">
              abstract
            </span>
            <button id="btn-star-back" type="button" title="암기 완료 표시" class="p-2 rounded-full hover:bg-indigo-500 text-xl leading-none transition">
              ☆
            </button>
          </div>

          <div class="flex-1 flex flex-col items-center justify-center text-center px-4">
            <p id="meaning-text" class="text-2xl sm:text-3xl font-bold leading-snug break-keep">
              추상적인
            </p>
          </div>

          <div class="text-center">
            <span class="text-xs text-indigo-200">클릭하면 단어로 돌아갑니다</span>
          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- 하단 네비게이션 버튼 -->
  <footer class="w-full max-w-xl pb-4 flex flex-col gap-3">
    <div class="flex items-center justify-between gap-4">
      <button id="btn-prev" class="flex-1 py-3.5 px-5 bg-white hover:bg-slate-50 active:scale-[0.99] text-slate-700 font-semibold rounded-2xl shadow-sm border border-slate-200 transition flex items-center justify-center gap-2">
        <span>←</span> 이전
      </button>
      <button id="btn-flip" class="py-3.5 px-6 bg-slate-800 hover:bg-slate-700 active:scale-[0.99] text-white font-semibold rounded-2xl shadow-sm transition">
        뜻 보기
      </button>
      <button id="btn-next" class="flex-1 py-3.5 px-5 bg-indigo-600 hover:bg-indigo-700 active:scale-[0.99] text-white font-semibold rounded-2xl shadow-sm transition flex items-center justify-center gap-2">
        다음 <span>→</span>
      </button>
    </div>
    <p class="text-center text-[11px] text-slate-400">
      단축키: ← / → (이전/다음 이동) · Space / Enter (카드 뒤집기)
    </p>
  </footer>

      { word: "sustain", meaning: "유지하다, 지속시키다" },

      { word: "transmit", meaning: "전달하다, 전송하다" },

      { word: "trigger", meaning: "촉발하다" },
      { word: "undergo", meaning: "겪다" },
      { word: "undermine", meaning: "약화시키다" },
      { word: "universal", meaning: "보편적인" },
      { word: "utilize", meaning: "활용하다" },
      { word: "valid", meaning: "타당한, 유효한" },
      { word: "voluntary", meaning: "자발적인" },
      { word: "whereas", meaning: "반면에" },
      { word: "withdraw", meaning: "철회하다, 물러나다" },
      { word: "yield", meaning: "산출하다, 양보하다" }
    ];

    let deck = [...INITIAL_WORDS];
    let currentIndex = 0;
    let isFlipped = false;
    let memorizedSet = new Set();
    let onlyUnmemorized = false;

    const cardInner = document.getElementById("card-inner");
    const cardContainer = document.getElementById("card-container");
    const wordText = document.getElementById("word-text");
    const wordTextBack = document.getElementById("word-text-back");
    const meaningText = document.getElementById("meaning-text");
    const counter = document.getElementById("counter");
    const cardAlphaBadge = document.getElementById("card-alpha-badge");
    const btnStarFront = document.getElementById("btn-star-front");
    const btnStarBack = document.getElementById("btn-star-back");
    const unmemorizedCount = document.getElementById("unmemorized-count");
    const btnFilterUnmemorized = document.getElementById("btn-filter-unmemorized");
    const alphabetBar = document.getElementById("alphabet-bar");

    function renderAlphabetBar() {
      const letters = [...new Set(deck.map(item => item.word[0].toUpperCase()))].sort();
      alphabetBar.innerHTML = "";
      letters.forEach(letter => {
        const btn = document.createElement("button");
        btn.textContent = letter;
        btn.className = "px-2.5 py-1 text-xs font-bold rounded-md bg-white border border-slate-200 text-slate-600 hover:bg-indigo-50 hover:text-indigo-600 hover:border-indigo-200 transition shrink-0";
        btn.onclick = () => {
          const idx = deck.findIndex(item => item.word[0].toUpperCase() === letter);
          if (idx !== -1) {
            currentIndex = idx;
            isFlipped = false;
            updateCard();
          }
        };
        alphabetBar.appendChild(btn);
      });
    }

    function updateCard() {
      unmemorizedCount.textContent = INITIAL_WORDS.length - memorizedSet.size;

      if (deck.length === 0) {
        wordText.textContent = "모두 암기했습니다! 🎉";
        wordTextBack.textContent = "완료";
        meaningText.textContent = "상단의 '미암기만 보기'를 해제하면 전체 단어를 다시 볼 수 있습니다.";
        counter.textContent = "0 / 0";
        cardAlphaBadge.textContent = "-";
        return;
      }

      if (currentIndex >= deck.length) currentIndex = 0;
      if (currentIndex < 0) currentIndex = deck.length - 1;

      const currentItem = deck[currentIndex];
      wordText.textContent = currentItem.word;
      wordTextBack.textContent = currentItem.word;
      meaningText.textContent = currentItem.meaning;
      counter.textContent = `${currentIndex + 1} / ${deck.length}`;
      cardAlphaBadge.textContent = currentItem.word[0].toUpperCase();

      const isMem = memorizedSet.has(currentItem.word);
      const starChar = isMem ? "⭐" : "☆";
      btnStarFront.textContent = starChar;
      btnStarBack.textContent = starChar;

      if (isFlipped) {
        cardInner.classList.add("rotate-y-180");
      } else {
        cardInner.classList.remove("rotate-y-180");
      }
    }

    function flipCard() {
      if (deck.length === 0) return;
      isFlipped = !isFlipped;
      updateCard();
    }

    function nextCard() {
      if (deck.length === 0) return;
      isFlipped = false;
      currentIndex = (currentIndex + 1) % deck.length;
      updateCard();
    }

    function prevCard() {
      if (deck.length === 0) return;
      isFlipped = false;
      currentIndex = (currentIndex - 1 + deck.length) % deck.length;
      updateCard();
    }

    function toggleMemorized(e) {
      e.stopPropagation();
      if (deck.length === 0) return;
      const word = deck[currentIndex].word;
      if (memorizedSet.has(word)) {
        memorizedSet.delete(word);
      } else {
        memorizedSet.add(word);
      }

      if (onlyUnmemorized) {
        deck = INITIAL_WORDS.filter(item => !memorizedSet.has(item.word));
        isFlipped = false;
      }
      updateCard();
    }

    function speakWord(e) {
      e.stopPropagation();
      if (deck.length === 0 || !("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(deck[currentIndex].word);
      utterance.lang = "en-US";
      utterance.rate = 0.95;
      window.speechSynthesis.speak(utterance);
    }

    // 이벤트 연결
    cardContainer.addEventListener("click", flipCard);
    document.getElementById("btn-flip").addEventListener("click", flipCard);
    document.getElementById("btn-next").addEventListener("click", nextCard);
    document.getElementById("btn-prev").addEventListener("click", prevCard);
    btnStarFront.addEventListener("click", toggleMemorized);
    btnStarBack.addEventListener("click", toggleMemorized);
    document.getElementById("btn-speak").addEventListener("click", speakWord);

    document.getElementById("btn-shuffle").addEventListener("click", () => {
      for (let i = deck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [deck[i], deck[j]] = [deck[j], deck[i]];
      }
      currentIndex = 0;
      isFlipped = false;
      updateCard();
    });

    document.getElementById("btn-reset-order").addEventListener("click", () => {
      const base = onlyUnmemorized
        ? INITIAL_WORDS.filter(item => !memorizedSet.has(item.word))
        : [...INITIAL_WORDS];
      deck = base.sort((a, b) => a.word.localeCompare(b.word));
      currentIndex = 0;
      isFlipped = false;
      renderAlphabetBar();
      updateCard();
    });

    btnFilterUnmemorized.addEventListener("click", () => {
      onlyUnmemorized = !onlyUnmemorized;
      if (onlyUnmemorized) {
        deck = INITIAL_WORDS.filter(item => !memorizedSet.has(item.word));
        btnFilterUnmemorized.classList.replace("bg-amber-50", "bg-amber-500");
        btnFilterUnmemorized.classList.replace("text-amber-700", "text-white");
      } else {
        deck = [...INITIAL_WORDS];
        btnFilterUnmemorized.classList.replace("bg-amber-500", "bg-amber-50");
        btnFilterUnmemorized.classList.replace("text-white", "text-amber-700");
      }
      currentIndex = 0;
      isFlipped = false;
      renderAlphabetBar();
      updateCard();
    });

    // 키보드 단축키
    document.addEventListener("keydown", (e) => {
      if (e.code === "ArrowRight") {
        nextCard();
      } else if (e.code === "ArrowLeft") {
        prevCard();
      } else if (e.code === "Space" || e.code === "Enter") {
        e.preventDefault();
        flipCard();
      }
    });

    // 모바일 스와이프 지원
    let touchStartX = 0;
    cardContainer.addEventListener("touchstart", (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    cardContainer.addEventListener("touchend", (e) => {
      const diff = e.changedTouches[0].screenX - touchStartX;
      if (Math.abs(diff) > 50) {
        if (diff < 0) nextCard();
        else prevCard();
      }
    }, { passive: true });

    // 초기화
    renderAlphabetBar();
    updateCard();
  </script>
</body>
</html>
